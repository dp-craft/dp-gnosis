# The gates, in the order CONTRIBUTING.md states them.
#
# The two test suites run SEQUENTIALLY, as separate steps rather than one
# parallel job matrix. Run concurrently they have produced a false red once
# already — they share a work directory (handbook/GNOSIS-GUIDE.md § Landmines).
# Splitting them across parallel jobs would reintroduce exactly that.
#
# The benchmark itself (`npm run gnosis:bench`) is NOT run here: it needs a
# reranker served at 127.0.0.1:9292 with warm models, and the recorded `.trec`
# evidence in packages/gnosis-bench/results/, which is untracked. A retrieval
# quality change is gated by a measured local run, not by CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Linux is the support contract; macOS is best-effort (packages/gnosis
    # package.json `os`). `better-sqlite3` is a NATIVE build — `node:sqlite`
    # cannot compile FTS5 (nodejs/node#56951) — so a platform's compiler and
    # prebuilt availability is a real failure mode, not a hypothetical one.
    # `fail-fast: false` so a macOS break still reports the Linux verdict.
    #
    # `node-version-file: .nvmrc` is deliberately NOT used here: the matrix owns
    # the version, and two sources would silently disagree. `.nvmrc` stays the
    # local default.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    name: gates (${{ matrix.os }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Engine suite
        run: npm run gnosis:test

      - name: Benchmark suite
        run: npm run bench:test

      - name: Build the published surface
        run: npm run build -w dp-gnosis

      - name: Check the published tarball
        run: npm pack --dry-run -w dp-gnosis
